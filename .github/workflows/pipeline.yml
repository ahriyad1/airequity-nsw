name: Daily forecast

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch: # "Run workflow" button, for demonstrations
  push:
    branches: [main]
    paths:
      [
        ".github/workflows/pipeline.yml",
        "src/**",
        "tests/**",
        "requirements.txt",
      ]

permissions:
  contents: write # needed to commit the forecast files back

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          # The validated model is scikit-learn's HistGradientBoosting.
          # LightGBM installs cleanly on Linux runners and the scripts would
          # prefer it, producing forecasts from a different model than the
          # one reported. Remove it so the runner matches the validation.
          pip uninstall -y lightgbm || true

      # ---- 1. Rebuild the 2023-2024 training data --------------------------
      - name: Restore historical observations
        run: |
          mkdir -p data/processed data/raw
          curl -sSL -o obs.zip \
            https://github.com/ahriyad1/airequity-nsw/releases/download/v0.1-data/observations.zip
          unzip -q obs.zip -d data/processed
          rm obs.zip
          # Keep only the validated training years
          find data/processed/observations -maxdepth 1 -type d -name 'year=*' \
            ! -name 'year=2023' ! -name 'year=2024' -exec rm -rf {} +

      - name: Restore 2016-2025 history for the daily model
        run: |
          mkdir -p data/processed/history
          curl -sSL -o hist.zip \
            https://github.com/ahriyad1/airequity-nsw/releases/download/v0.2-data/observations.zip
          unzip -q hist.zip -d data/processed/history
          rm hist.zip

      - name: Fetch station registry
        run: python src/ingest/fetch_observations.py --list-sites

      - name: Build temporal features
        run: python src/features/build_features.py

      - name: Build spatial features
        run: python src/features/spatial_features.py

      # ---- 2. Gate on data quality -----------------------------------------
      - name: Run data quality tests
        run: python -m pytest tests/ -v

      # ---- 3. Recent inputs --------------------------------------------------
      # Training features are already built, so the observations store can now
      # be replaced with just the recent window the forecast needs.
      - name: Fetch recent observations
        run: |
          # The API treats the end date as exclusive and its dates are Sydney
          # time, so ending at today's Sydney date fetches all of yesterday.
          # (Ending at "1 day ago" in UTC lost a whole day.)
          START=$(TZ=Australia/Sydney date -d '11 days ago' +%F)
          END=$(TZ=Australia/Sydney date +%F)
          python src/ingest/fetch_observations.py --start "$START" --end "$END" \
            --parameters PM2.5 TEMP HUMID WSP WDR

      - name: Rebuild observations store
        run: python src/storage/write_parquet.py

      - name: Fetch forecast weather
        run: python src/ingest/fetch_weather_openMeteo.py --past-days 3

      # ---- 4. Forecast and publish ---------------------------------------------
      - name: Produce daily forecast
        run: python src/models/predict_daily.py

      - name: Commit forecast files
        run: |
          git config user.name  "airequity-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/latest_daily_forecast.parquet \
                     data/processed/latest_daily_forecast_meta.json \
                     data/processed/latest_observations.parquet
          if git diff --cached --quiet; then
            echo "Forecast unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Automated forecast $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push

      - name: Keep run outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forecast-${{ github.run_number }}
          path: |
            data/processed/latest_daily_forecast.parquet
            data/processed/latest_daily_forecast_meta.json
          retention-days: 14
